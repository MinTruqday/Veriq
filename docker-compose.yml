name: veriq

x-service-environment: &service-environment
  PYTHONDONTWRITEBYTECODE: "1"
  PROJECT_NAME: ${PROJECT_NAME:?PROJECT_NAME is required}
  VERSION: ${VERSION:?VERSION is required}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:?ACCESS_TOKEN_EXPIRE_MINUTES is required}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:?REFRESH_TOKEN_EXPIRE_DAYS is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
  REDIS_URI: ${REDIS_URI:?REDIS_URI is required}
  PLATFORM_SYSTEM_ID: ${PLATFORM_SYSTEM_ID:?PLATFORM_SYSTEM_ID is required}
  INTERNAL_API_URL: ${INTERNAL_API_URL:?INTERNAL_API_URL is required}
  MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:?MAX_UPLOAD_SIZE_BYTES is required}
  MIN_UPLOAD_SIZE_BYTES: ${MIN_UPLOAD_SIZE_BYTES:?MIN_UPLOAD_SIZE_BYTES is required}

x-object-storage-environment: &object-storage-environment
  OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?OBJECT_STORAGE_ENDPOINT is required}
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
  OBJECT_STORAGE_PRIVATE_BUCKET: ${OBJECT_STORAGE_PRIVATE_BUCKET:?OBJECT_STORAGE_PRIVATE_BUCKET is required}
  OBJECT_STORAGE_PUBLIC_BUCKET: ${OBJECT_STORAGE_PUBLIC_BUCKET:?OBJECT_STORAGE_PUBLIC_BUCKET is required}
  OBJECT_STORAGE_PUBLIC_URL: ${OBJECT_STORAGE_PUBLIC_URL:?OBJECT_STORAGE_PUBLIC_URL is required}
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:?OBJECT_STORAGE_REGION is required}

x-app-healthcheck: &app-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/san-sang', timeout=15)"]
  interval: 30s
  timeout: 60s
  start_period: 60s
  retries: 3

x-container-logging: &container-logging
  driver: json-file
  options:
    max-size: ${CONTAINER_LOG_MAX_SIZE:?CONTAINER_LOG_MAX_SIZE is required}
    max-file: ${CONTAINER_LOG_MAX_FILES:?CONTAINER_LOG_MAX_FILES is required}

services:
  mongodb:
    image: mongo:7.0@sha256:35a5926f71f8b6cb19206bee928c5a85f241a8be99f20c81abe35ae78a73415d
    container_name: veriq_mongodb
    init: true
    restart: always
    logging: *container-logging
    command:
      - --replSet
      - rs0
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "0.5"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "if [ -f /data/db/.replica-set-ready ]; then timeout 5s bash -c 'exec 3<>/dev/tcp/127.0.0.1/27017'; else timeout 60s mongosh --quiet --eval 'try { const state = rs.status(); quit(state.ok == 1 ? 0 : 1) } catch (error) { try { quit(rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongodb:27017\"}]}).ok == 1 ? 0 : 1) } catch (retryError) { quit(retryError.codeName == \"AlreadyInitialized\" ? 0 : 1) } }' && touch /data/db/.replica-set-ready; fi"]
      interval: 30s
      timeout: 70s
      start_period: 60s
      retries: 20
    networks:
      - veriq_network

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: veriq_redis
    restart: always
    logging: *container-logging
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    networks:
      - veriq_network

  rabbitmq:
    image: rabbitmq:3-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    container_name: veriq_rabbitmq
    init: true
    restart: always
    logging: *container-logging
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 30s
      timeout: 45s
      start_period: 60s
      retries: 12
    networks:
      - veriq_network

  traefik:
    image: traefik:v3.7.6@sha256:21a3d83696379bac6434bb32e1dde0aff0e84ef2abd053ed3db87d3f45e749b2
    container_name: veriq_traefik
    restart: always
    logging: *container-logging
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:8000
      - --ping=true
      - --ping.entrypoint=web
    ports:
      - 8000:8000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/ping"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - veriq_network

  nginx:
    image: fholzer/nginx-brotli@sha256:e0aa855b74b7cdd0bb13a8cb1599e3af9b6210a98fb6234081b551899bfb924c
    container_name: veriq_nginx
    restart: always
    logging: *container-logging
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=80
    networks:
      - veriq_network
    depends_on:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 20s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    container_name: veriq_frontend
    restart: always
    logging: *container-logging
    ports:
      - 3000:3000
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 60s
      start_period: 60s
      retries: 3
    depends_on:
      - traefik
    networks:
      - veriq_network

  notification:
    healthcheck: *app-healthcheck
    build:
      context: ./backend
      dockerfile: ./notification/Dockerfile
    container_name: veriq_notification
    restart: always
    logging: *container-logging
    ports:
      - 8004:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.notification.rule=PathPrefix(`/thong-bao`)
      - traefik.http.services.notification.loadbalancer.server.port=8000
    environment:
      <<: *service-environment
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:?NOTIFICATION_DB_NAME is required}
      AUTHENTICATION_URL: ${AUTHENTICATION_URL:?AUTHENTICATION_URL is required}
    depends_on:
      - authentication
      - mongodb
      - redis
    networks:
      - veriq_network

  ai:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/suc-khoe', timeout=15)"]
      interval: 30s
      timeout: 20s
      start_period: 180s
      retries: 6
    build:
      context: ./backend
      dockerfile: ./ai/Dockerfile
    container_name: veriq_ai
    restart: always
    logging: *container-logging
    ports:
      - 8015:8000
      - 38470-38479:38470-38479
    labels:
      - traefik.enable=true
      - traefik.http.routers.ai.rule=PathPrefix(`/suy-luan`) || PathPrefix(`/su-kien`) || PathPrefix(`/tiep-nap`) || PathPrefix(`/tri-thuc`) || PathPrefix(`/danh-gia`) || PathPrefix(`/tac-tu`) || PathPrefix(`/tu-dong-hoa-ai`) || PathPrefix(`/mcp`)
      - traefik.http.services.ai.loadbalancer.server.port=8000
    environment:
      <<: [*service-environment, *object-storage-environment]
      AI_DB_NAME: ${AI_DB_NAME:?AI_DB_NAME is required}
      AUTHENTICATION_URL: ${AUTHENTICATION_URL:?AUTHENTICATION_URL is required}
      CONTENT_URL: ${CONTENT_URL:?CONTENT_URL is required}
      RABBITMQ_URI: ${RABBITMQ_URI:?RABBITMQ_URI is required}
      QDRANT_URL: ${QDRANT_URL:?QDRANT_URL is required}
      DOCKER_HOST: ${DOCKER_HOST:?DOCKER_HOST is required}
      HF_TOKEN: ${HF_TOKEN:?HF_TOKEN is required}
      HF_HOME: ${HF_HOME:?HF_HOME is required}
      HF_INFERENCE_URL: ${HF_INFERENCE_URL:?HF_INFERENCE_URL is required}
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL is required}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:?MODEL_TIMEOUT_SECONDS is required}
      PRIMARY_MODEL_URL: ${PRIMARY_MODEL_URL:?PRIMARY_MODEL_URL is required}
      PRIMARY_MODEL_HEALTH_URL: ${PRIMARY_MODEL_HEALTH_URL:?PRIMARY_MODEL_HEALTH_URL is required}
      RERANKER_MODEL: ${RERANKER_MODEL:?RERANKER_MODEL is required}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?EMBEDDING_MODEL is required}
      NLI_MODEL_NAME: ${NLI_MODEL_NAME:?NLI_MODEL_NAME is required}
      NEO4J_URI: ${NEO4J_URI:?NEO4J_URI is required}
      NEO4J_USER: ${NEO4J_USER:?NEO4J_USER is required}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:?LANGSMITH_TRACING is required}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:?LANGSMITH_ENDPOINT is required}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:?LANGSMITH_API_KEY is required}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:?LANGSMITH_PROJECT is required}
      MCP_GITHUB_TOKEN: ${MCP_GITHUB_TOKEN:-}
      MCP_POSTMAN_API_KEY: ${MCP_POSTMAN_API_KEY:-}
      MCP_PLAYWRIGHT_TOKEN: ${MCP_PLAYWRIGHT_TOKEN:-}
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface
    networks:
      - veriq_network

  testing:
    healthcheck: *app-healthcheck
    build:
      context: ./backend
      dockerfile: ./testing/Dockerfile
    container_name: veriq_testing
    restart: always
    logging: *container-logging
    ports:
      - 8017:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.testing.rule=PathPrefix(`/kiem-thu`) || PathPrefix(`/noi-bo/kiem-thu`)
      - traefik.http.routers.testing.priority=110
      - traefik.http.services.testing.loadbalancer.server.port=8000
    environment:
      <<: *service-environment
      TESTING_DB_NAME: ${TESTING_DB_NAME:?TESTING_DB_NAME is required}
      AUTHENTICATION_URL: ${AUTHENTICATION_URL:?AUTHENTICATION_URL is required}
      WORKER_URL: ${WORKER_URL:?WORKER_URL is required}
      AI_URL: ${AI_URL:?AI_URL is required}
      CONTENT_URL: ${CONTENT_URL:?CONTENT_URL is required}
      CLOUD_URL: ${CLOUD_URL:?CLOUD_URL is required}
    depends_on:
      - mongodb
      - ai
      - content
      - cloud
      - worker
    networks:
      - veriq_network

  qdrant:
    image: qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    container_name: veriq_qdrant
    restart: always
    logging: *container-logging
    ports:
      - 6333:6333
      - 6334:6334
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - veriq_network

  neo4j:
    image: neo4j:5.26.12-community
    container_name: veriq_neo4j
    restart: always
    logging: *container-logging
    environment:
      NEO4J_AUTH: ${NEO4J_USER:?NEO4J_USER is required}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - 7474:7474
      - 7687:7687
    volumes:
      - neo4j_data:/data
    networks:
      - veriq_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u ${NEO4J_USER:?NEO4J_USER is required} -p ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required} 'RETURN 1'",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.13.0@sha256:c6b27ea434f8389bfe233fbc7be381cf50587c286e871bc842008f5a1b1908a7
    container_name: veriq_prometheus
    restart: always
    logging: *container-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:?PROMETHEUS_RETENTION_TIME is required}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:?PROMETHEUS_RETENTION_SIZE is required}
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - veriq_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 20s
      retries: 3

  grafana:
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    container_name: veriq_grafana
    restart: always
    logging: *container-logging
    ports:
      - 127.0.0.1:3001:3000
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana_provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - veriq_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 20s
      retries: 3

  authentication:
    healthcheck: *app-healthcheck
    build:
      context: ./backend
      dockerfile: ./authentication/Dockerfile
    container_name: veriq_authentication
    restart: always
    logging: *container-logging
    ports:
      - 8007:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.authentication.rule=PathPrefix(`/xac-thuc/`) || PathPrefix(`/quan-tri`)
      - traefik.http.routers.authentication.priority=120
      - traefik.http.services.authentication.loadbalancer.server.port=8000
    environment:
      <<: *service-environment
      AUTHENTICATION_DB_NAME: ${AUTHENTICATION_DB_NAME:?AUTHENTICATION_DB_NAME is required}
      AI_INTERNAL_URL: ${AI_INTERNAL_URL:?AI_INTERNAL_URL is required}
      AUTHENTICATION_INTERNAL_URL: ${AUTHENTICATION_INTERNAL_URL:?AUTHENTICATION_INTERNAL_URL is required}
      CLOUD_INTERNAL_URL: ${CLOUD_INTERNAL_URL:?CLOUD_INTERNAL_URL is required}
      CONTENT_INTERNAL_URL: ${CONTENT_INTERNAL_URL:?CONTENT_INTERNAL_URL is required}
      TESTING_INTERNAL_URL: ${TESTING_INTERNAL_URL:?TESTING_INTERNAL_URL is required}
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL is required}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?EMBEDDING_MODEL is required}
      RERANKER_MODEL: ${RERANKER_MODEL:?RERANKER_MODEL is required}
      WORKER_INTERNAL_URL: ${WORKER_INTERNAL_URL:?WORKER_INTERNAL_URL is required}
      GOOGLE_AUTH_URL: ${GOOGLE_AUTH_URL:?GOOGLE_AUTH_URL is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:?GOOGLE_REDIRECT_URI is required}
      GOOGLE_TOKEN_URL: ${GOOGLE_TOKEN_URL:?GOOGLE_TOKEN_URL is required}
      GOOGLE_USERINFO_URL: ${GOOGLE_USERINFO_URL:?GOOGLE_USERINFO_URL is required}
      PASSKEY_ALLOWED_ORIGINS: ${PASSKEY_ALLOWED_ORIGINS:?PASSKEY_ALLOWED_ORIGINS is required}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:?PASSKEY_RP_ID is required}
      PASSKEY_RP_NAME: ${PASSKEY_RP_NAME:?PASSKEY_RP_NAME is required}
      SENDER_EMAIL: ${SENDER_EMAIL:?SENDER_EMAIL is required}
      SENDER_NAME: ${SENDER_NAME:?SENDER_NAME is required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS is required}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
    depends_on:
      - mongodb
      - redis
    networks:
      - veriq_network
  content:
    healthcheck: *app-healthcheck
    build:
      context: ./backend
      dockerfile: ./content/Dockerfile
    container_name: veriq_content
    restart: always
    logging: *container-logging
    ports:
      - 8010:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.content.rule=PathPrefix(`/tai-lieu`) || PathPrefix(`/phien-ban`)
      - traefik.http.services.content.loadbalancer.server.port=8000
    environment:
      <<: *service-environment
      CONTENT_DB_NAME: ${CONTENT_DB_NAME:?CONTENT_DB_NAME is required}
      AUTHENTICATION_URL: ${AUTHENTICATION_URL:?AUTHENTICATION_URL is required}
      AI_URL: ${AI_URL:?AI_URL is required}
      NOTIFICATION_URL: ${NOTIFICATION_URL:?NOTIFICATION_URL is required}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?OBJECT_STORAGE_ENDPOINT is required}
      OBJECT_STORAGE_PUBLIC_URL: ${OBJECT_STORAGE_PUBLIC_URL:?OBJECT_STORAGE_PUBLIC_URL is required}
      RABBITMQ_URI: ${RABBITMQ_URI:?RABBITMQ_URI is required}
    depends_on:
      - authentication
      - mongodb
      - redis
      - rabbitmq
    networks:
      - veriq_network

  cloud:
    healthcheck: *app-healthcheck
    build:
      context: ./backend
      dockerfile: ./cloud/Dockerfile
    container_name: veriq_cloud
    restart: always
    logging: *container-logging
    ports:
      - 8008:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.cloud.rule=PathPrefix(`/luu-tru`) || PathPrefix(`/tai-len`) || PathPrefix(`/tep-tin`) || PathPrefix(`/thu-muc`) || PathPrefix(`/phan-doan`) || PathPrefix(`/tai-ve`)
      - traefik.http.services.cloud.loadbalancer.server.port=8000
    environment:
      <<: [*service-environment, *object-storage-environment]
      CLOUD_DB_NAME: ${CLOUD_DB_NAME:?CLOUD_DB_NAME is required}
      COMPRESSIBLE_TEXT_EXTENSIONS: ${COMPRESSIBLE_TEXT_EXTENSIONS:?COMPRESSIBLE_TEXT_EXTENSIONS is required}
      AUTHENTICATION_URL: ${AUTHENTICATION_URL:?AUTHENTICATION_URL is required}
      OBJECT_STORAGE_LEGACY_BUCKET: ${OBJECT_STORAGE_LEGACY_BUCKET:?OBJECT_STORAGE_LEGACY_BUCKET is required}
    depends_on:
      - authentication
      - mongodb
      - redis
    networks:
      - veriq_network

  worker:
    healthcheck: *app-healthcheck
    build:
      context: ./backend
      dockerfile: ./worker/Dockerfile
    container_name: veriq_worker
    restart: always
    logging: *container-logging
    ports:
      - 8009:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.worker.rule=PathPrefix(`/xu-ly-nen`)
      - traefik.http.services.worker.loadbalancer.server.port=8000
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?PROJECT_NAME is required}
      VERSION: ${VERSION:?VERSION is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      RABBITMQ_URI: ${RABBITMQ_URI:?RABBITMQ_URI is required}
      WORKER_DB_NAME: ${WORKER_DB_NAME:?WORKER_DB_NAME is required}
      WORKER_QUEUE_NAME: ${WORKER_QUEUE_NAME:?WORKER_QUEUE_NAME is required}
      TESTING_URL: ${TESTING_URL:?TESTING_URL is required}
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - veriq_network

networks:
  veriq_network:
    name: veriq_network
    driver: bridge

volumes:
  mongodb_data: null
  redis_data: null
  rabbitmq_data: null
  qdrant_data: null
  neo4j_data: null
  prometheus_data: null
  grafana_data: null
  hf_cache:
